  <body>
    <div id="quiz-container">
      <h1 class="sr-only">Cuestionario de rapidez: interpretaci&oacute;n de gr&aacute;ficas estad&iacute;sticas</h1>
      <div class="quiz-progress-header">
        <div class="progress-text" id="progress-text">Pregunta 1 de 20</div>
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
      </div>
      <div id="question-area"></div>
      <div class="timer-container" id="timer-container">
        <div class="timer-text" id="timer-text">&#9201; Tiempo: 60s</div>
        <div class="timer-bar-container"><div class="timer-bar" id="timer-bar"></div></div>
      </div>
      <div class="result-screen hidden" id="result-screen">
        <h2>&#128202; &iexcl;Cuestionario completado!</h2>
        <p class="result-score" id="final-score"></p>
        <p class="result-msg" id="final-msg"></p>
        <div class="cat-results" id="cat-results"></div>
        <div class="tip-box" id="tip-box"></div>
        <div class="btn-container" style="padding-top:14px">
          <div class="primary-btn" id="restart-btn" role="button" tabindex="0">&#128260; Nuevas preguntas (reiniciar)</div>
        </div>
      </div>
      <p class="creditos">
        Creado por Jos&eacute; M. Fern&aacute;ndez, ABE/ASE Math Master Teacher, Harry S. Truman College &mdash; City Colleges of Chicago.<br>
        Licencia <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>.
      </p>

    <script>
    (function () {
      if (window.quizGraficasIniciado) return;
      window.quizGraficasIniciado = true;

      /* ── UTILIDADES ── */
      function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function suma(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
      function maxi(a) { return a.indexOf(Math.max.apply(null, a)); }
      function mini(a) { return a.indexOf(Math.min.apply(null, a)); }
      function pick(a) { return a[rand(0, a.length - 1)]; }

      /* ── OPCIONES NUMÉRICAS ── */
      function makeOpts(correct, dist) {
        const cs = String(correct), seen = new Set([cs]), uniq = [];
        for (const d of dist) {
          const ds = String(d);
          if (!seen.has(ds) && uniq.length < 3) { seen.add(ds); uniq.push(ds); }
        }
        let ex = (parseFloat(cs) || 0) + 7;
        while (uniq.length < 3) {
          const c2 = String(Math.round(ex * 100) / 100); ex += 5;
          if (!seen.has(c2)) { seen.add(c2); uniq.push(c2); }
        }
        const all = shuffle([cs, ...uniq]);
        const L = ['a', 'b', 'c', 'd'];
        return { opciones: all.map(function (v, i) { return { valor: L[i], texto: L[i].toUpperCase() + '. ' + v }; }), correcta: L[all.indexOf(cs)] };
      }

      /* ── OPCIONES DE TEXTO ── */
      function makeOptsText(ok, dist) {
        const seen = new Set([ok]), uniq = [];
        for (const d of dist) { if (!seen.has(d) && uniq.length < 3) { seen.add(d); uniq.push(d); } }
        while (uniq.length < 3) { uniq.push('Ninguna de las anteriores ' + uniq.length); }
        const all = shuffle([ok, ...uniq]);
        const L = ['a', 'b', 'c', 'd'];
        return { opciones: all.map(function (v, i) { return { valor: L[i], texto: L[i].toUpperCase() + '. ' + v }; }), correcta: L[all.indexOf(ok)] };
      }

      /* ══════════════════════════════════════
         GENERADORES DE SVG ACCESIBLE
      ══════════════════════════════════════ */
      let UID = 0;
      const PAL = ['#1565c0', '#b45309', '#166534', '#6d28d9', '#0e7490', '#9d174d'];

      function escalaY(max) {
        const pasos = [1, 2, 4, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000];
        for (const s of pasos) { if (max / s <= 5) return { paso: s, tope: Math.max(s, Math.ceil(max / s) * s) }; }
        return { paso: 5000, tope: Math.ceil(max / 5000) * 5000 };
      }

      function ejes(x0, x1, y0, y1, tope, paso, uni) {
        let g = '';
        for (let v = 0; v <= tope; v += paso) {
          const y = y1 - (v / tope) * (y1 - y0);
          g += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="#d5dde5" stroke-width="1"/>';
          g += '<text x="' + (x0 - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#333">' + v + '</text>';
        }
        g += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="#333" stroke-width="2"/>';
        g += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + y1 + '" stroke="#333" stroke-width="2"/>';
        const ym = (y0 + y1) / 2;
        g += '<text x="16" y="' + ym + '" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90 16 ' + ym + ')">' + uni + '</text>';
        return g;
      }

      function envolver(w, h, desc, cuerpo) {
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:min(' + w + 'px,100%)" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + desc + '">' + cuerpo + '</svg>';
      }

      /* ── Gráfica de barras simple ── */
      function svgBarras(tit, cats, vals, uni, col) {
        const W = 440, H = 272, x0 = 62, x1 = 424, y0 = 46, y1 = 216;
        const e = escalaY(Math.max.apply(null, vals));
        let s = '<text x="' + (W / 2) + '" y="22" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a2e">' + tit + '</text>';
        s += ejes(x0, x1, y0, y1, e.tope, e.paso, uni);
        const n = cats.length, slot = (x1 - x0) / n, bw = slot * 0.54;
        for (let i = 0; i < n; i++) {
          const cx = x0 + slot * i + slot / 2;
          const y = y1 - (vals[i] / e.tope) * (y1 - y0);
          s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y1 - y).toFixed(1) + '" fill="' + (col || '#1565c0') + '" stroke="#0b3a66" stroke-width="1"/>';
          s += '<text x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">' + vals[i] + '</text>';
          s += '<text x="' + cx.toFixed(1) + '" y="' + (y1 + 18) + '" text-anchor="middle" font-size="11.5" fill="#1a1a2e">' + cats[i] + '</text>';
        }
        const desc = tit + '. ' + cats.map(function (c, i) { return c + ': ' + vals[i]; }).join('; ') + '.';
        return envolver(W, H, desc, s);
      }

      /* ── Gráfica de barras dobles (con trama para la segunda serie) ── */
      function svgBarrasDobles(tit, cats, A, B, nomA, nomB, uni) {
        const W = 440, H = 296, x0 = 62, x1 = 424, y0 = 46, y1 = 208;
        const id = 'trama' + (++UID);
        const e = escalaY(Math.max(Math.max.apply(null, A), Math.max.apply(null, B)));
        let s = '<defs><pattern id="' + id + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
          '<rect width="6" height="6" fill="#b45309"/><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-width="2.4"/></pattern></defs>';
        s += '<text x="' + (W / 2) + '" y="22" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a2e">' + tit + '</text>';
        s += ejes(x0, x1, y0, y1, e.tope, e.paso, uni);
        const n = cats.length, slot = (x1 - x0) / n, bw = slot * 0.3;
        for (let i = 0; i < n; i++) {
          const cx = x0 + slot * i + slot / 2;
          const ya = y1 - (A[i] / e.tope) * (y1 - y0);
          const yb = y1 - (B[i] / e.tope) * (y1 - y0);
          s += '<rect x="' + (cx - bw - 2).toFixed(1) + '" y="' + ya.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y1 - ya).toFixed(1) + '" fill="#1565c0" stroke="#0b3a66" stroke-width="1"/>';
          s += '<rect x="' + (cx + 2).toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y1 - yb).toFixed(1) + '" fill="url(#' + id + ')" stroke="#7a4a06" stroke-width="1"/>';
          s += '<text x="' + (cx - bw / 2 - 2).toFixed(1) + '" y="' + (ya - 5).toFixed(1) + '" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a2e">' + A[i] + '</text>';
          s += '<text x="' + (cx + bw / 2 + 2).toFixed(1) + '" y="' + (yb - 5).toFixed(1) + '" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a2e">' + B[i] + '</text>';
          s += '<text x="' + cx.toFixed(1) + '" y="' + (y1 + 18) + '" text-anchor="middle" font-size="11.5" fill="#1a1a2e">' + cats[i] + '</text>';
        }
        s += '<rect x="' + (x0 + 10) + '" y="' + (y1 + 32) + '" width="14" height="12" fill="#1565c0" stroke="#0b3a66"/>';
        s += '<text x="' + (x0 + 30) + '" y="' + (y1 + 42) + '" font-size="11.5" fill="#1a1a2e">' + nomA + '</text>';
        s += '<rect x="' + (x0 + 150) + '" y="' + (y1 + 32) + '" width="14" height="12" fill="url(#' + id + ')" stroke="#7a4a06"/>';
        s += '<text x="' + (x0 + 170) + '" y="' + (y1 + 42) + '" font-size="11.5" fill="#1a1a2e">' + nomB + '</text>';
        const desc = tit + '. ' + cats.map(function (c, i) { return c + ': ' + nomA + ' ' + A[i] + ', ' + nomB + ' ' + B[i]; }).join('; ') + '.';
        return envolver(W, H, desc, s);
      }

      /* ── Gráfica circular ── */
      function svgCircular(tit, labels, pcts) {
        const W = 440, H = 250, cx = 108, cy = 142, r = 84;
        function pt(ang, rad) {
          const a = (ang - 90) * Math.PI / 180;
          return [(cx + rad * Math.cos(a)).toFixed(1), (cy + rad * Math.sin(a)).toFixed(1)];
        }
        let s = '<text x="' + (W / 2) + '" y="22" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a2e">' + tit + '</text>';
        let ang = 0;
        for (let i = 0; i < pcts.length; i++) {
          const fin = ang + pcts[i] * 3.6;
          const p1 = pt(ang, r), p2 = pt(fin, r);
          const grande = pcts[i] * 3.6 > 180 ? 1 : 0;
          s += '<path d="M ' + cx + ' ' + cy + ' L ' + p1[0] + ' ' + p1[1] + ' A ' + r + ' ' + r + ' 0 ' + grande + ' 1 ' + p2[0] + ' ' + p2[1] + ' Z" fill="' + PAL[i % PAL.length] + '" stroke="#fff" stroke-width="2"/>';
          if (pcts[i] >= 11) {
            const m = pt((ang + fin) / 2, r * 0.62);
            s += '<text x="' + m[0] + '" y="' + m[1] + '" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">' + pcts[i] + '%</text>';
          }
          ang = fin;
        }
        for (let i = 0; i < labels.length; i++) {
          const y = 78 + i * 26;
          s += '<rect x="234" y="' + (y - 11) + '" width="15" height="15" fill="' + PAL[i % PAL.length] + '" stroke="#333" stroke-width="0.8"/>';
          s += '<text x="257" y="' + y + '" font-size="12.5" fill="#1a1a2e">' + labels[i] + ' &#8212; ' + pcts[i] + '%</text>';
        }
        const desc = tit + '. ' + labels.map(function (l, i) { return l + ': ' + pcts[i] + ' por ciento'; }).join('; ') + '.';
        return envolver(W, H, desc, s);
      }

      /* ── Gráfica lineal (una o dos series) ── */
      function svgLinea(tit, labels, A, uni, B, nomA, nomB) {
        const W = 440, H = B ? 296 : 272, x0 = 62, x1 = 424, y0 = 46, y1 = B ? 208 : 216;
        const todos = B ? A.concat(B) : A;
        const e = escalaY(Math.max.apply(null, todos));
        let s = '<text x="' + (W / 2) + '" y="22" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a2e">' + tit + '</text>';
        s += ejes(x0, x1, y0, y1, e.tope, e.paso, uni);
        const n = labels.length, slot = (x1 - x0) / n;
        function px(i) { return x0 + slot * i + slot / 2; }

      /* ── Histograma (barras contiguas) ── */
      function svgHistograma(tit, intervalos, freqs, uni) {
        const W = 440, H = 272, x0 = 62, x1 = 424, y0 = 46, y1 = 216;
        const e = escalaY(Math.max.apply(null, freqs));
        let s = '<text x="' + (W / 2) + '" y="22" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a2e">' + tit + '</text>';
        s += ejes(x0, x1, y0, y1, e.tope, e.paso, uni);
        const n = intervalos.length, bw = (x1 - x0) / n;
        for (let i = 0; i < n; i++) {
          const x = x0 + bw * i;
          const y = y1 - (freqs[i] / e.tope) * (y1 - y0);
          s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y1 - y).toFixed(1) + '" fill="#166534" stroke="#fff" stroke-width="1.5"/>';
          s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">' + freqs[i] + '</text>';
          s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y1 + 18) + '" text-anchor="middle" font-size="10.5" fill="#1a1a2e">' + intervalos[i] + '</text>';
        }
        const desc = tit + '. ' + intervalos.map(function (c, i) { return 'intervalo ' + c + ': ' + freqs[i]; }).join('; ') + '.';
        return envolver(W, H, desc, s);

          const o = makeOpts(pct + ' %', [f[i] + ' %', (100 - pct) + ' %', (pct + 8) + ' %']);
          return {
            cat: 'Histograma', t: 65,
            q: 'Se registr&oacute; el tiempo de traslado de 50 trabajadores. &iquest;Qu&eacute; <strong>porcentaje</strong> tarda entre <strong>' + inter[i].replace('-', ' y ') + ' minutos</strong>?',
            data: svgHistograma('Tiempo de traslado al trabajo (minutos)', inter, f, 'Trabajadores'),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'La barra mide ' + f[i] + ' trabajadores de 50 en total: ' + f[i] + ' &divide; 50 = ' + (f[i] / 50) + ', y &times; 100 = <strong>' + pct + ' %</strong>.'
          };
        },

        /* ── HISTOGRAMA 3: intervalo de la mediana ── */
        function () {
          const inter = ['1-2', '3-4', '5-6', '7-8'];
          let f, acum, k;
          do {
            f = [rand(4, 16), rand(4, 16), rand(4, 16)];
            f.push(40 - suma(f));
            acum = []; let s = 0;
            for (let i = 0; i < 4; i++) { s += f[i]; acum.push(s); }
            k = -1;
            for (let i = 0; i < 4; i++) { if (k < 0 && acum[i] >= 21) { k = i; } }
          } while (f[3] < 4 || f[3] > 18 || acum.indexOf(20) >= 0);
          const o = makeOptsText(inter[k], inter.filter(function (x) { return x !== inter[k]; }));
          return {
            cat: 'Histograma', t: 75,
            q: 'Se encuest&oacute; a 40 familias. &iquest;En qu&eacute; <strong>intervalo se encuentra la mediana</strong> del n&uacute;mero de libros le&iacute;dos?',
            data: svgHistograma('Libros le&iacute;dos por familia en el a&ntilde;o', inter, f, 'Familias'),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'Con 40 datos, la mediana est&aacute; entre el dato 20 y el 21. Frecuencias acumuladas: ' + acum.map(function (a, i) { return inter[i] + '&rarr;' + a; }).join(', ') + '. El primer intervalo que alcanza el dato 21 es <strong>' + inter[k] + '</strong>.'
          };
        },

        /* ── HISTOGRAMA 4: comparación entre intervalos ── */
        function () {
          const inter = ['18-27', '28-37', '38-47', '48-57'];
          let f;
          do { f = [rand(5, 20), rand(5, 20), rand(5, 20), rand(5, 20)]; }
          while (new Set(f).size < 4);
          const a = maxi(f), b = mini(f), res = f[a] - f[b];
          const o = makeOpts(res, [f[a] + f[b], f[a], suma(f)]);
          return {
            cat: 'Histograma', t: 60,
            q: '&iquest;Cu&aacute;ntas personas <strong>m&aacute;s</strong> hay en el intervalo m&aacute;s numeroso que en el menos numeroso?',
            data: svgHistograma('Edades de los participantes del taller', inter, f, 'Personas'),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'M&aacute;s numeroso: ' + inter[a] + ' con ' + f[a] + '. Menos numeroso: ' + inter[b] + ' con ' + f[b] + '. Diferencia = <strong>' + res + ' personas</strong>.'
          };
        },

        /* ── INFERENCIA 1: afirmación respaldada por la gráfica ── */
        function () {
          const cats = ['Norte', 'Sur', 'Este', 'Oeste'];
          const mn = rand(3, 7) * 5;
          const mx = mn * 2 + rand(1, 4) * 5;
          const m1 = mn + rand(1, 3) * 5, m2 = mn + rand(4, 6) * 5;
          const v = [mx, m2, m1, mn];
          const idx = shuffle([0, 1, 2, 3]);
          const vv = idx.map(function (i) { return v[i]; });
          const iMax = maxi(vv), iMin = mini(vv);
          const total = suma(vv);
          const ok = cats[iMax] + ' vendi&oacute; m&aacute;s del doble que ' + cats[iMin] + '.';
          const dist = [
            'Las cuatro sucursales superaron las ' + (Math.min.apply(null, vv) + 10) + ' unidades.',
            'El total de las cuatro sucursales fue menor que ' + (total - 20) + ' unidades.',
            cats[iMin] + ' y ' + cats[(iMin + 1) % 4] + ' vendieron exactamente lo mismo.'
          ];
          const o = makeOptsText(ok, dist);
          return {
            cat: 'Inferencia', t: 75,
            q: '&iquest;Cu&aacute;l afirmaci&oacute;n est&aacute; <strong>respaldada por la gr&aacute;fica</strong>?',
            data: svgBarras('Ventas trimestrales por sucursal', cats, vv, 'Unidades', '#1565c0'),
            opciones: o.opciones, correcta: o.correcta,
            exp: cats[iMax] + ' tiene ' + Math.max.apply(null, vv) + ' y ' + cats[iMin] + ' tiene ' + Math.min.apply(null, vv) + '. El doble de ' + Math.min.apply(null, vv) + ' es ' + (Math.min.apply(null, vv) * 2) + ', y ' + Math.max.apply(null, vv) + ' lo supera. Las dem&aacute;s afirmaciones se contradicen con los valores de las barras.'
          };
        },

        /* ── INFERENCIA 2: conclusión que NO se puede obtener ── */
        function () {
          const meses = ['Ene', 'Feb', 'Mar', 'Abr'];
          const v0 = rand(4, 9) * 10;
          const v = [v0, v0 + rand(1, 4) * 10, 0, 0];
          v[2] = v[1] + rand(1, 4) * 10;
          v[3] = v[2] + rand(1, 4) * 10;
          const ok = 'El aumento se debi&oacute; a la nueva campa&ntilde;a publicitaria.';
          const dist = [
            'Las ventas aumentaron en todos los meses registrados.',
            'En abril se registraron ' + v[3] + ' unidades.',
            'El aumento total de enero a abril fue de ' + (v[3] - v[0]) + ' unidades.'
          ];
          const o = makeOptsText(ok, dist);
          return {
            cat: 'Inferencia', t: 75,
            q: 'Seg&uacute;n la gr&aacute;fica, &iquest;cu&aacute;l conclusi&oacute;n <strong>NO se puede obtener</strong>?',
            data: svgLinea('Ventas mensuales del producto', meses, v, 'Unidades'),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'La gr&aacute;fica muestra <em>qu&eacute;</em> ocurri&oacute;, no <em>por qu&eacute;</em> ocurri&oacute;. Atribuir el aumento a una campa&ntilde;a publicitaria es una <strong>causa</strong> que la gr&aacute;fica no registra. Las otras tres afirmaciones se leen directamente de los puntos.'
          };
        },

        /* ── INFERENCIA 3: tipo de gráfica apropiado ── */
        function () {
          const casos = [
            { e: 'Se desea mostrar c&oacute;mo se reparte, en porcentajes, el presupuesto anual de un hogar entre cuatro rubros.', ok: 'Gr&aacute;fica circular' },
            { e: 'Se desea mostrar el cambio de la temperatura promedio de una ciudad durante los doce meses del a&ntilde;o.', ok: 'Gr&aacute;fica lineal' },
            { e: 'Se desea mostrar cu&aacute;ntos estudiantes hay en cada intervalo de edad: 18-27, 28-37, 38-47 y 48-57.', ok: 'Histograma' },
            { e: 'Se desea comparar el total de ventas de cinco sucursales distintas durante el mismo mes.', ok: 'Gr&aacute;fica de barras' }
          ];
          const c = pick(casos);
          const todas = ['Gr&aacute;fica circular', 'Gr&aacute;fica lineal', 'Histograma', 'Gr&aacute;fica de barras'];
          const o = makeOptsText(c.ok, todas.filter(function (x) { return x !== c.ok; }));
          return {
            cat: 'Inferencia', t: 55,
            q: '&iquest;Cu&aacute;l tipo de gr&aacute;fica es <strong>m&aacute;s apropiado</strong> para esta situaci&oacute;n?',
            data: '<div class="escenario">' + c.e + '</div>',
            opciones: o.opciones, correcta: o.correcta,
            exp: 'Regla pr&aacute;ctica: partes de un total &rarr; circular; cambio a lo largo del tiempo &rarr; lineal; datos agrupados en intervalos &rarr; histograma; comparaci&oacute;n entre categor&iacute;as separadas &rarr; barras. Aqu&iacute; corresponde <strong>' + c.ok + '</strong>.'
          };
        },

        /* ── INFERENCIA 4: dos pasos con gráfica circular ── */
        function () {
          const juegos = [[40, 30, 20, 10], [50, 20, 20, 10], [40, 25, 25, 10], [30, 30, 30, 10]];
          const pcts = pick(juegos);
          const labels = ['Turno ma&ntilde;ana', 'Turno tarde', 'Turno noche', 'Fin de semana'];
          const N = pick([400, 600, 800, 1000]);
          const i = 0;
          const grupo = N * pcts[i] / 100, res = grupo / 2;
          const o = makeOpts(res, [grupo, N / 2, grupo * 2]);
          return {
            cat: 'Inferencia', t: 80,
            q: 'El centro atiende a <strong>' + N + ' estudiantes</strong>. De los del <strong>' + labels[i] + '</strong>, la <strong>mitad</strong> tiene m&aacute;s de 40 a&ntilde;os. &iquest;Cu&aacute;ntos estudiantes son?',
            data: svgCircular('Distribuci&oacute;n de estudiantes por turno', labels, pcts),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'Paso 1: ' + N + ' &times; ' + pcts[i] + ' &divide; 100 = ' + grupo + ' estudiantes en el ' + labels[i].toLowerCase() + '. Paso 2: la mitad de ' + grupo + ' es <strong>' + res + '</strong>. El error com&uacute;n es tomar la mitad del total general.'
          };
        }

      ]; /* fin GEN */

      /* ══════════════════════════════════════
         MOTOR DEL CUESTIONARIO
      ══════════════════════════════════════ */
      const preguntas = shuffle(GEN.map(function (g) { return g(); }));
      const total = preguntas.length;
      let actual = 0, puntos = 0, respondida = false, reloj = null, segs = 0;
      const catPts = {}, catTot = {};
      preguntas.forEach(function (p) {
        catTot[p.cat] = (catTot[p.cat] || 0) + 1;
        catPts[p.cat] = catPts[p.cat] || 0;
      });

      const qArea = document.getElementById('question-area');
      const barP = document.getElementById('progress-bar');
      const txtP = document.getElementById('progress-text');

      function render(i) {
        const p = preguntas[i];
        const col = CC[p.cat] || '#0f6e4f';
        const icon = CI[p.cat] || '';
        const tLbl = p.t <= 55 ? '&#9889; R&aacute;pida' : p.t <= 70 ? '&#128336; Media' : '&#9203; Compleja';
        const opHtml = p.opciones.map(function (o) {
          return '<div class="option-item" role="button" tabindex="0" data-val="' + o.valor + '" onclick="window.__grClick(this)" onkeydown="window.__grKey(this,event)">' + o.texto + '</div>';
        }).join('');
        const dH = p.data ? '<div class="data-box">' + p.data + '</div>' : '';
        const btn = i === total - 1 ? 'Ver resultados' : 'Siguiente &rsaquo;';
        qArea.innerHTML =
          '<div class="question-meta">' +
            '<span class="cat-badge" style="background:' + col + '"><span aria-hidden="true">' + icon + '</span> ' + p.cat + '</span>' +
            '<span class="time-badge">' + tLbl + ' &middot; ' + p.t + 's</span>' +
          '</div>' +
          '<div class="question-header">' + p.q + '</div>' +
          dH +
          '<div class="options">' + opHtml + '</div>' +
          '<div class="feedback-box hidden" id="feedback-box" role="status" aria-live="polite"></div>' +
          '<div class="btn-container"><div class="primary-btn" role="button" tabindex="0" onclick="window.__grNext()" onkeydown="window.__grNextKey(event)">' + btn + '</div></div>';
        if (barP) { barP.style.width = ((i + 1) / total) * 100 + '%'; }
        if (txtP) { txtP.textContent = 'Pregunta ' + (i + 1) + ' de ' + total; }
        iniciarReloj(p.t);
      }

      function bloquear() {
        qArea.querySelectorAll('.option-item').forEach(function (o) {
          if (o.className.indexOf('disabled') < 0) { o.className += ' disabled'; }
          o.setAttribute('tabindex', '-1');
        });
      }

      function mostrarExp(acierto) {
        const p = preguntas[actual];
        const fb = document.getElementById('feedback-box');
        if (!fb) { return; }
        fb.className = 'feedback-box' + (acierto ? '' : ' mal');
        fb.innerHTML = (acierto ? '<strong>&#10004; Correcto.</strong> ' : '<strong>&#10008; Revisa el procedimiento.</strong> ') + (p.exp || '');
      }

      window.__grClick = function (el) {
        if (respondida) { return; }
        pararReloj();
        respondida = true;
        const p = preguntas[actual];
        const elegida = el.getAttribute('data-val');
        const acierto = elegida === p.correcta;
        if (acierto) {
          el.className = 'option-item correct disabled';
          puntos++;
          catPts[p.cat]++;
        } else {
          el.className = 'option-item incorrect disabled';
          const ok = qArea.querySelector('.option-item[data-val="' + p.correcta + '"]');
          if (ok) { ok.className = 'option-item correct disabled'; }
        }
        bloquear();
        mostrarExp(acierto);
      };

      window.__grKey = function (el, ev) {
        if (!ev) { return; }
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          window.__grClick(el);
        }
      };

      window.__grNext = function () {
        pararReloj();
        actual++;
        respondida = false;
        if (actual < total) { render(actual); } else { mostrarRes(); }
      };

      window.__grNextKey = function (ev) {
        if (!ev) { return; }
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          window.__grNext();
        }
      };

      function iniciarReloj(s) {
        pararReloj();
        segs = s;
        updReloj();
        reloj = setInterval(function () { segs--; updReloj(); if (segs <= 0) { tAgotado(); } }, 1000);
      }
      function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
      function updReloj() {
        const p = preguntas[actual] || { t: 60 };
        const tt = document.getElementById('timer-text');
        const tb = document.getElementById('timer-bar');
        const tc = document.getElementById('timer-container');
        if (tt) { tt.textContent = '\u23F1 Tiempo: ' + segs + 's'; }
        const pct = (segs / p.t) * 100;
        if (tb) {
          tb.style.width = pct + '%';
          if (pct <= 25) {
            tb.style.background = '#b3261e';
            if (tc) { tc.className = 'timer-container timer-warning'; }
          } else if (pct <= 50) {
            tb.style.background = 'linear-gradient(90deg,#b06f00,#b3261e)';
            if (tc) { tc.className = 'timer-container'; }
          } else {
            tb.style.background = 'linear-gradient(90deg,#1b5e20,#b06f00,#b3261e)';
            if (tc) { tc.className = 'timer-container'; }
          }
        }
      }
      function tAgotado() {
        pararReloj();
        if (respondida) { return; }
        respondida = true;
        const p = preguntas[actual];
        const ok = qArea.querySelector('.option-item[data-val="' + p.correcta + '"]');
        if (ok) { ok.className = 'option-item correct disabled'; }
        bloquear();
        mostrarExp(false);
        const tt = document.getElementById('timer-text');
        if (tt) { tt.textContent = '\u23F0 \u00a1Tiempo agotado!'; }
        const tc = document.getElementById('timer-container');
        if (tc) { tc.className = 'timer-container timer-warning'; }
      }

      function mostrarRes() {
        pararReloj();
        qArea.innerHTML = '';
        document.getElementById('timer-container').style.display = 'none';
        const pct = Math.round((puntos / total) * 100);
        document.getElementById('final-score').textContent = puntos + ' / ' + total + '  (' + pct + '%)';
        const msg = pct >= 85 ? '\u{1F3C6} \u00a1Excelente! Interpretas gr\u00e1ficas con la seguridad que exige el GED.'
                  : pct >= 70 ? '\u{1F44D} \u00a1Muy bien! Repasa las categor\u00edas marcadas en rojo.'
                  : pct >= 50 ? '\u{1F4AA} Buen intento. Practica la diferencia entre LEER un valor e INTERPRETAR la gr\u00e1fica.'
                  : '\u{1F4DA} Empieza por lo b\u00e1sico: t\u00edtulo, ejes, escala y unidades antes de calcular.';
        document.getElementById('final-msg').textContent = msg;
        let html = '<h3>Resultados por categor\u00eda:</h3>';
        for (const cat of Object.keys(catTot)) {
          const s = catPts[cat] || 0, t2 = catTot[cat];
          const p2 = Math.round((s / t2) * 100);
          const col = CC[cat] || '#0f6e4f';
          html +=
            '<div class="cat-row">' +
              '<span class="cat-lbl"><span aria-hidden="true">' + CI[cat] + '</span> ' + cat + '</span>' +
              '<div class="cat-bar-out"><div class="cat-bar-in" style="width:' + p2 + '%;background:' + col + '"></div></div>' +
              '<span class="cat-sc">' + s + '/' + t2 + ' \u2713</span>' +
            '</div>';
        }
        document.getElementById('cat-results').innerHTML = html;
        let minCat = '', minPct = 999;
        for (const cat of Object.keys(catTot)) {
          const pp = (catPts[cat] || 0) / catTot[cat];
          if (pp < minPct) { minPct = pp; minCat = cat; }
        }
        document.getElementById('tip-box').innerHTML = minPct < 1
          ? '<strong>\u{1F4CC} Para mejorar en \u00ab' + minCat + '\u00bb:</strong><br>' + (TIPS[minCat] || '')
          : '\u2705 \u00a1Sin categor\u00edas con errores! Ahora intenta mejorar tus tiempos.';
        document.getElementById('result-screen').className = 'result-screen';
        document.querySelector('.quiz-progress-header').style.display = 'none';
        const rb = document.getElementById('restart-btn');
        rb.onclick = function () { window.location.reload(); };
        rb.onkeydown = function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); window.location.reload(); }
        };
      }

      render(0);
    })();
    </script>
  </body>
</html>
