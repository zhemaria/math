  <body>

    <script>
    (function () {
      if (window.quizOrdenIniciado) return;
      window.quizOrdenIniciado = true;

      /* ── UTILIDADES ── */
      function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function pick(a) { return a[rand(0, a.length - 1)]; }

      /* ── SÍMBOLOS ── */
      const X = ' &times; ';      /* multiplicación */
      const D = ' &divide; ';     /* división */
      const M = ' &minus; ';      /* signo menos */
      const P = ' + ';
      const NEG = '&minus;';      /* menos unario */

      /* ── OPCIONES NUMÉRICAS ── */
      function makeOpts(correct, dist) {
        const cs = String(correct), seen = new Set([cs]), uniq = [];
        for (const d of dist) {
          const ds = String(d);
          if (!seen.has(ds) && uniq.length < 3 && isFinite(d)) { seen.add(ds); uniq.push(ds); }
        }
        let ex = (parseFloat(cs) || 0) + 6;
        while (uniq.length < 3) {
          const c2 = String(Math.round(ex)); ex += 7;
          if (!seen.has(c2)) { seen.add(c2); uniq.push(c2); }
        }
        const all = shuffle([cs, ...uniq]);
        const L = ['a', 'b', 'c', 'd'];
        return { opciones: all.map(function (v, i) { return { valor: L[i], texto: L[i].toUpperCase() + '. ' + fmt(v) }; }), correcta: L[all.indexOf(cs)] };
      }

      /* ── OPCIONES DE TEXTO ── */
      function makeOptsText(ok, dist) {
        const seen = new Set([ok]), uniq = [];
        for (const d of dist) { if (!seen.has(d) && uniq.length < 3) { seen.add(d); uniq.push(d); } }
        while (uniq.length < 3) { uniq.push('Ninguna de las anteriores ' + uniq.length); }
        const all = shuffle([ok, ...uniq]);
        const L = ['a', 'b', 'c', 'd'];
        return { opciones: all.map(function (v, i) { return { valor: L[i], texto: L[i].toUpperCase() + '. ' + v }; }), correcta: L[all.indexOf(ok)] };
      }

      /* ── Formato de negativos con el signo menos tipográfico ── */
      function fmt(n) {
        const s = String(n);
        return s.charAt(0) === '-' ? NEG + s.slice(1) : s;
      }

      /* ── Caja de expresión y tabla de pasos ── */
      function caja(exp) { return '<div class="expr">' + exp + '</div>'; }
      function tablaPasos(filas) {
        let h = '<table class="pasos"><caption>Procedimiento paso a paso de un estudiante</caption>' +
          '<tr><th scope="col">Paso</th><th scope="col">Lo que hizo</th></tr>';
        filas.forEach(function (f, i) {
          h += '<tr><td>Paso ' + (i + 1) + '</td><td>' + f + '</td></tr>';
        });
        return h + '</table>';
      }

      /* ── CATEGORÍAS ── */
      const CC = {
        'Jerarqu\u00eda': '#1565c0',
        'Anidadas': '#5b21b6',
        'Exponentes': '#0e7490',
        'Signos': '#8a4b00',
        'Errores': '#9d174d'
      };
      const CI = {
        'Jerarqu\u00eda': '\u2261',
        'Anidadas': '\u2261',
        'Exponentes': '\u00b2',
        'Signos': '\u00b1',
        'Errores': '\u26a0'
      };
      const TIPS = {
        'Jerarqu\u00eda':
          'El orden es: (1) agrupaciones, (2) exponentes y ra\u00edces, (3) multiplicaci\u00f3n y divisi\u00f3n de IZQUIERDA A DERECHA, (4) suma y resta de izquierda a derecha. La multiplicaci\u00f3n no va antes que la divisi\u00f3n: van en el mismo nivel.',
        'Anidadas':
          'Con agrupaciones dentro de agrupaciones se resuelve SIEMPRE de adentro hacia afuera: primero el par\u00e9ntesis m\u00e1s interno, despu\u00e9s el corchete y por \u00faltimo la llave. Reescribe la expresi\u00f3n completa en cada paso; no intentes hacer dos niveles a la vez.',
        'Exponentes':
          'Ojo con el signo: \u22124\u00b2 es \u2212(4\u00b74) = \u221216, mientras que (\u22124)\u00b2 = +16. El exponente afecta solo a lo que est\u00e1 pegado a \u00e9l. Adem\u00e1s, (a + b)\u00b2 NO es a\u00b2 + b\u00b2: primero se suma dentro del par\u00e9ntesis.',
        'Signos':
          'Menos por menos da m\u00e1s; menos por m\u00e1s da menos. Resta un par\u00e9ntesis precedido de menos cambia TODOS los signos de adentro. La barra de fracci\u00f3n agrupa: se resuelve todo el numerador y todo el denominador antes de dividir.',
        'Errores':
          'Revisa el trabajo paso a paso y comp\u00e1ralo con la jerarqu\u00eda. El error m\u00e1s frecuente en el examen es operar de izquierda a derecha ignorando la multiplicaci\u00f3n, el exponente o el par\u00e9ntesis.'
      };

      /* ══════════════════════════════════════
         GENERADORES — 20 preguntas (4 por categoría)
      ══════════════════════════════════════ */
      const GEN = [

        /* ── JERARQUÍA 1: suma, multiplicación y resta ── */
        function () {
          const a = rand(5, 18), b = rand(3, 9), c = rand(3, 9), d = rand(2, 12);
          const res = a + b * c - d;
          const o = makeOpts(res, [(a + b) * c - d, a + b * (c - d), b * c]);
          return {
            cat: 'Jerarqu\u00eda', t: 55,
            q: 'Calcula el valor de la expresi&oacute;n.',
            data: caja(a + P + b + X + c + M + d),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'Primero la multiplicaci&oacute;n: ' + b + X + c + ' = ' + (b * c) + '. Queda ' + a + P + (b * c) + M + d + ' = <strong>' + res + '</strong>. Resolver de izquierda a derecha dar&iacute;a ' + ((a + b) * c - d) + ', que es el error m&aacute;s com&uacute;n.'
          };
        },

        /* ── JERARQUÍA 2: multiplicación y división combinadas ── */
        function () {
          const d = rand(2, 6), q = rand(3, 9), c = d * q;
          const a = rand(3, 9), b = rand(3, 9), e = rand(2, 10);
          const res = a * b + q - e;
          const o = makeOpts(res, [a * b + c - d - e, a * (b + q) - e, res + q]);
          return {
            cat: 'Jerarqu\u00eda', t: 60,
            q: 'Calcula el valor de la expresi&oacute;n.',
            data: caja(a + X + b + P + c + D + d + M + e),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'Multiplicaci&oacute;n y divisi&oacute;n van en el mismo nivel: ' + a + X + b + ' = ' + (a * b) + ' y ' + c + D + d + ' = ' + q + '. Queda ' + (a * b) + P + q + M + e + ' = <strong>' + res + '</strong>.'
          };
        },

        /* ── JERARQUÍA 3: identificar la primera operación ── */
        function () {
          const a = rand(4, 15), b = rand(2, 8), c = rand(7, 14), d = rand(2, 6), e = rand(2, 5);
          const o = makeOptsText('La resta que est&aacute; dentro del par&eacute;ntesis',
            ['La multiplicaci&oacute;n', 'El exponente', 'La divisi&oacute;n']);
          return {
            cat: 'Jerarqu\u00eda', t: 45,
            q: '&iquest;Cu&aacute;l operaci&oacute;n debe realizarse <strong>primero</strong>?',
            data: caja(a + P + b + X + '(' + c + M + d + ')&sup2;' + D + e),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'La jerarqu&iacute;a comienza por las <strong>agrupaciones</strong>. Aunque hay exponente, multiplicaci&oacute;n y divisi&oacute;n, lo primero es siempre lo que est&aacute; dentro del par&eacute;ntesis: ' + c + M + d + ' = ' + (c - d) + '.'
          };
        },

        /* ── JERARQUÍA 4: división y multiplicación de izquierda a derecha ── */
        function () {
          const b = rand(2, 5), c = rand(2, 6), m = rand(2, 6), a = b * c * m;
          const res = (a / b) * c;
          const o = makeOpts(res, [m, a - b * c, m * c]);
          return {
            cat: 'Jerarqu\u00eda', t: 55,
            q: 'Calcula el valor de la expresi&oacute;n.',
            data: caja(a + D + b + X + c),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'Divisi&oacute;n y multiplicaci&oacute;n tienen la MISMA prioridad, as&iacute; que se resuelven de izquierda a derecha: ' + a + D + b + ' = ' + (a / b) + ', y luego ' + (a / b) + X + c + ' = <strong>' + res + '</strong>. Multiplicar primero (' + b + X + c + ') dar&iacute;a ' + m + ', que es incorrecto.'
          };
        },

        /* ── ANIDADAS 1: corchete con exponente interno ── */
        function () {
          const d = rand(2, 5), p = rand(2, 4), c = d + p;
          const b = p * p + rand(2, 9), a = rand(2, 6);
          const dentro = b - p * p, res = a * dentro;
          const o = makeOpts(res, [a * b - p * p, a * (b - c + d), (a * b - p) * 1 + d]);
          return {
            cat: 'Anidadas', t: 70,
            q: 'Calcula el valor de la expresi&oacute;n.',
            data: caja(a + X + '[ ' + b + M + '(' + c + M + d + ')&sup2; ]'),
            opciones: o.opciones, correcta: o.correcta,
            exp: 'De adentro hacia afuera: (' + c + M + d + ') = ' + p + '; luego ' + p + '&sup2; = ' + (p * p) + '; dentro del corchete ' + b + M + (p * p) + ' = ' + dentro + '; por &uacute;ltimo ' + a + X + dentro + ' = <strong>' + res + '</strong>.'
          };
        },

        /* ── ANIDADAS 2: corchete completo dividido ── */
        function () {
          const a = rand(2, 9), b = rand(2, 9), c = rand(3, 8), e = rand(2, 6);
          const prod = (a + b) * c;
          const d = (prod % e) + e * rand(1, 3);
          const num = prod - d, res = num / e;
          const o = makeOpts(res, [num, a + b * c - d, Math.round(prod / e) - d]);
          return {
            cat: 'Anidadas', t: 75,

      /* ══════════════════════════════════════
         MOTOR DEL CUESTIONARIO
      ══════════════════════════════════════ */
      const preguntas = shuffle(GEN.map(function (g) { return g(); }));
      const total = preguntas.length;
      let actual = 0, puntos = 0, respondida = false, reloj = null, segs = 0;
      const catPts = {}, catTot = {};
      preguntas.forEach(function (p) {

      const barP = document.getElementById('progress-bar');
      const txtP = document.getElementById('progress-text');

        const p = preguntas[i];
        const col = CC[p.cat] || '#5b21b6';
        const icon = CI[p.cat] || '';
        const tLbl = p.t <= 55 ? '&#9889; R&aacute;pida' : p.t <= 70 ? '&#128336; Media' : '&#9203; Compleja';
        const opHtml = p.opciones.map(function (o) {
          return '<div class="option-item" role="button" tabindex="0" data-val="' + o.valor + '" onclick="window.__opClick(this)" onkeydown="window.__opKey(this,event)">' + o.texto + '</div>';
        }).join('');
        const dH = p.data ? '<div class="data-box">' + p.data + '</div>' : '';
        const btn = i === total - 1 ? 'Ver resultados' : 'Siguiente &rsaquo;';
        qArea.innerHTML =
          '<div class="question-meta">' +
            '<span class="cat-badge" style="background:' + col + '"><span aria-hidden="true">' + icon + '</span> ' + p.cat + '</span>' +

          '</div>' +
          '<div class="question-header">' + p.q + '</div>' +
          dH +
          '<div class="options">' + opHtml + '</div>' +
          '<div class="feedback-box hidden" id="feedback-box" role="status" aria-live="polite"></div>' +
          '<div class="btn-container"><div class="primary-btn" role="button" tabindex="0" onclick="window.__opNext()" onkeydown="window.__opNextKey(event)">' + btn + '</div></div>';
        if (barP) { barP.style.width = ((i + 1) / total) * 100 + '%'; }
        if (txtP) { txtP.textContent = 'Pregunta ' + (i + 1) + ' de ' + total; }
        iniciarReloj(p.t);
      }

      function bloquear() {
        qArea.querySelectorAll('.option-item').forEach(function (o) {
          if (o.className.indexOf('disabled') < 0) { o.className += ' disabled'; }
          o.setAttribute('tabindex', '-1');
        });
      }

      function mostrarExp(acierto) {
        const p = preguntas[actual];
        const fb = document.getElementById('feedback-box');
        if (!fb) { return; }
        fb.className = 'feedback-box' + (acierto ? '' : ' mal');
        fb.innerHTML = (acierto ? '<strong>&#10004; Correcto.</strong> ' : '<strong>&#10008; Revisa el procedimiento.</strong> ') + (p.exp || '');
      }

      window.__opClick = function (el) {
        if (respondida) { return; }
        pararReloj();
        respondida = true;
        const p = preguntas[actual];
        const elegida = el.getAttribute('data-val');
        const acierto = elegida === p.correcta;
        if (acierto) {
          el.className = 'option-item correct disabled';
          puntos++;
          catPts[p.cat]++;
        } else {
          el.className = 'option-item incorrect disabled';
          const ok = qArea.querySelector('.option-item[data-val="' + p.correcta + '"]');
          if (ok) { ok.className = 'option-item correct disabled'; }
        }
        bloquear();
        mostrarExp(acierto);
      };

      window.__opKey = function (el, ev) {
        if (!ev) { return; }
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          window.__opClick(el);
        }
      };

      window.__opNext = function () {
        pararReloj();
        actual++;
        respondida = false;
        if (actual < total) { render(actual); } else { mostrarRes(); }
      };

      window.__opNextKey = function (ev) {
        if (!ev) { return; }
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          window.__opNext();
        }
      };

      function iniciarReloj(s) {
        pararReloj();
        segs = s;
        updReloj();
        reloj = setInterval(function () { segs--; updReloj(); if (segs <= 0) { tAgotado(); } }, 1000);
      }
      function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
      function updReloj() {
        const p = preguntas[actual] || { t: 60 };
        const tt = document.getElementById('timer-text');
        const tb = document.getElementById('timer-bar');
        const tc = document.getElementById('timer-container');
        if (tt) { tt.textContent = '\u23F1 Tiempo: ' + segs + 's'; }
        const pct = (segs / p.t) * 100;
        if (tb) {
          tb.style.width = pct + '%';
          if (pct <= 25) {
            tb.style.background = '#b3261e';
            if (tc) { tc.className = 'timer-container timer-warning'; }
          } else if (pct <= 50) {
            tb.style.background = 'linear-gradient(90deg,#b06f00,#b3261e)';
            if (tc) { tc.className = 'timer-container'; }
          } else {
            tb.style.background = 'linear-gradient(90deg,#1b5e20,#b06f00,#b3261e)';
            if (tc) { tc.className = 'timer-container'; }
          }
        }
      }
      function tAgotado() {
        pararReloj();
        if (respondida) { return; }
        respondida = true;
        const p = preguntas[actual];
        const ok = qArea.querySelector('.option-item[data-val="' + p.correcta + '"]');
        if (ok) { ok.className = 'option-item correct disabled'; }
        bloquear();
        mostrarExp(false);
        const tt = document.getElementById('timer-text');
        if (tt) { tt.textContent = '\u23F0 \u00a1Tiempo agotado!'; }
        const tc = document.getElementById('timer-container');
        if (tc) { tc.className = 'timer-container timer-warning'; }
      }

      function mostrarRes() {
        pararReloj();
        qArea.innerHTML = '';
        document.getElementById('timer-container').style.display = 'none';
        const pct = Math.round((puntos / total) * 100);
        document.getElementById('final-score').textContent = puntos + ' / ' + total + '  (' + pct + '%)';
        const msg = pct >= 85 ? '\u{1F3C6} \u00a1Excelente! Dominas la jerarqu\u00eda de las operaciones.'
                  : pct >= 70 ? '\u{1F44D} \u00a1Muy bien! Repasa las categor\u00edas marcadas en rojo.'
                  : pct >= 50 ? '\u{1F4AA} Buen intento. Reescribe la expresi\u00f3n completa en cada paso; evita atajos mentales.'
                  : '\u{1F4DA} Empieza por memorizar el orden: agrupaciones, exponentes, multiplicaci\u00f3n y divisi\u00f3n, suma y resta.';
        document.getElementById('final-msg').textContent = msg;
        let html = '<h3>Resultados por categor\u00eda:</h3>';
        for (const cat of Object.keys(catTot)) {
          const s = catPts[cat] || 0, t2 = catTot[cat];
          const p2 = Math.round((s / t2) * 100);
          const col = CC[cat] || '#5b21b6';
          html +=
            '<div class="cat-row">' +
              '<span class="cat-lbl"><span aria-hidden="true">' + CI[cat] + '</span> ' + cat + '</span>' +
              '<div class="cat-bar-out"><div class="cat-bar-in" style="width:' + p2 + '%;background:' + col + '"></div></div>' +
              '<span class="cat-sc">' + s + '/' + t2 + ' \u2713</span>' +
            '</div>';
        }
        document.getElementById('cat-results').innerHTML = html;
        let minCat = '', minPct = 999;
        for (const cat of Object.keys(catTot)) {
          const pp = (catPts[cat] || 0) / catTot[cat];
          if (pp < minPct) { minPct = pp; minCat = cat; }
        }
        document.getElementById('tip-box').innerHTML = minPct < 1
          ? '<strong>\u{1F4CC} Para mejorar en \u00ab' + minCat + '\u00bb:</strong><br>' + (TIPS[minCat] || '')
          : '\u2705 \u00a1Sin categor\u00edas con errores! Ahora intenta mejorar tus tiempos.';
        document.getElementById('result-screen').className = 'result-screen';
        document.querySelector('.quiz-progress-header').style.display = 'none';
        const rb = document.getElementById('restart-btn');
        rb.onclick = function () { window.location.reload(); };
        rb.onkeydown = function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); window.location.reload(); }
        };
      }

      render(0);
    })();
    </script>
  </body>
</html>
